        body {
            background-color: #000033;
            color: #FFFF00;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 12px;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Tło z zapętlonym wideo rybek - nietknięte podczas przejść */
        #bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -2;
            opacity: 0.45;
            pointer-events: none;
        }

        #bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Centralna scena gwarantująca absolutnie identyczną pozycję okienka */
        #stage-wrapper {
            position: relative;
            z-index: 1;
            display: grid;
            place-items: start center;
            width: 1120px;
            max-width: 96vw;
            margin: 0 auto;
        }

        #current-box,
        #incoming-box {
            grid-area: 1 / 1;
            width: 100%;
            box-sizing: border-box;
        }

        /* 1. PRZEJŚCIE DO PRZODU: Gwiazda Movie Maker */
        #incoming-box.star-mode {
            z-index: 10;
            pointer-events: none;
            clip-path: polygon(
                50% 48%, 50.6% 49.4%, 52% 49.4%, 50.9% 50.3%, 51.3% 51.7%,
                50% 50.8%, 48.7% 51.7%, 49.1% 50.3%, 48% 49.4%, 49.4% 49.4%
            );
            transition: clip-path 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        #incoming-box.star-mode.star-wipe-open {
            clip-path: polygon(
                50% -180%, 82% -45%, 240% -45%, 122% 52%, 175% 210%,
                50% 115%, -75% 210%, -22% 52%, -140% -45%, 18% -45%
            );
            pointer-events: auto;
        }

        /* 2. PRZEJŚCIE POWROTU: Mozaika / Pikselizacja Windows XP */
        @keyframes mosaicDisintegrate {
            0% {
                filter: blur(0px) contrast(100%) brightness(100%);
                transform: scale(1);
                opacity: 1;
            }
            45% {
                filter: blur(10px) contrast(220%) brightness(140%) saturate(200%);
                transform: scale(0.97);
                opacity: 0.75;
            }
            100% {
                filter: blur(22px) contrast(300%) brightness(180%);
                transform: scale(0.93);
                opacity: 0;
            }
        }

        @keyframes mosaicReassemble {
            0% {
                filter: blur(22px) contrast(300%) brightness(180%);
                transform: scale(0.93);
                opacity: 0;
            }
            55% {
                filter: blur(8px) contrast(190%) brightness(130%);
                transform: scale(0.98);
                opacity: 0.85;
            }
            100% {
                filter: blur(0px) contrast(100%) brightness(100%);
                transform: scale(1);
                opacity: 1;
            }
        }

        .mosaic-out {
            animation: mosaicDisintegrate 0.45s steps(6, end) forwards;
            pointer-events: none;
        }

        .mosaic-in {
            animation: mosaicReassemble 0.5s steps(7, end) forwards;
        }

        /* Siatka pikseli nakładana na czas mozaiki */
        #mosaic-grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            display: none;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 255, 0.25) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(0, 255, 255, 0.25) 2px, transparent 2px);
            background-size: 28px 28px;
        }

        #mosaic-grid-overlay.active {
            display: block;
        }

        /* Uniwersalny box dla każdej zawartości */
        .portal-box {
            width: 100%;
            box-sizing: border-box;
            background-color: rgba(0, 0, 85, 0.98);
            border: 5px ridge #FFCC00;
            padding: 18px 24px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            position: relative;

        /* Specjalna tabela główna dopasowana do wspólnego kontenera */

        async function updateRealVisitCounter() {
            try {
                const alreadyCounted = sessionStorage.getItem('skibidi_visited');
                const endpoint = alreadyCounted
                    ? 'https://api.counterapi.dev/v1/fakeabab-skibidiawards/visits'
                    : 'https://api.counterapi.dev/v1/fakeabab-skibidiawards/visits/up';

                const res = await fetch(endpoint);
                const data = await res.json();
                if (data && typeof data.count === 'number') {
                    sessionStorage.setItem('skibidi_visited', '1');
                    realVisitCount = String(data.count).padStart(7, '0');
                } else {
                    realVisitCount = '0000001';
                }
            } catch (e) {
                let local = parseInt(localStorage.getItem('skibidi_local_visits') || '1', 10);
                if (!sessionStorage.getItem('skibidi_visited')) {
                    local++;
                    localStorage.setItem('skibidi_local_visits', local);
                    sessionStorage.setItem('skibidi_visited', '1');
                }
                realVisitCount = String(local).padStart(7, '0');
            }

            const counterEl = document.getElementById('visit-counter-display');
            if (counterEl) counterEl.textContent = realVisitCount;
        }

            if (isTransitioning) return;
            isTransitioning = true;

            playAlternatingTransitionSound();

            const currentBox = document.getElementById('current-box');
            const incomingBox = document.getElementById('incoming-box');

            currentBox.style.display = 'none';

            updateStateCallback();
            incomingBox.innerHTML = buildHtmlForCurrentState();

            incomingBox.classList.add('star-mode');
            incomingBox.classList.remove('star-wipe-open');
            void incomingBox.offsetWidth;

            incomingBox.classList.add('star-wipe-open');

            setTimeout(() => {
                render();

                incomingBox.style.transition = 'none';
                incomingBox.classList.remove('star-mode', 'star-wipe-open');
                incomingBox.innerHTML = '';
                void incomingBox.offsetWidth;
                incomingBox.style.transition = '';
                isTransitioning = false;
            }, 1100);
        }

        // 2. PRZEJŚCIE POWROTU: Mozaika / Pikselizacja Windows XP

            if (isTransitioning) return;
            isTransitioning = true;

            playReturnSound();

            const currentBox = document.getElementById('current-box');
            const gridOverlay = document.getElementById('mosaic-grid-overlay');

            // Włączamy siatkę pikseli i rozbijamy stary obraz w mozaikę
            gridOverlay.classList.add('active');
            currentBox.classList.remove('mosaic-in');
            currentBox.classList.add('mosaic-out');

            // W połowie animacji podmieniamy treść i składamy z pikseli nowy widok
            setTimeout(() => {
                updateStateCallback();
                currentBox.innerHTML = buildHtmlForCurrentState();
                currentBox.classList.remove('mosaic-out');
                void currentBox.offsetWidth;
                currentBox.classList.add('mosaic-in');
            }, 450);

            // Kończymy i czyścimy klasy
            setTimeout(() => {
                currentBox.classList.remove('mosaic-in');
                gridOverlay.classList.remove('active');
                isTransitioning = false;
            }, 950);
        }

        // Nawigacja POWROTU / COFANIA używa Mozaiki Windows XP
