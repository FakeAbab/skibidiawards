<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~*~ SKIBIDI AWARDS 2006 - OFICJALNY PORTAL GŁOSOWANIA ~*~</title>
    <style>
        body {
            background-color: #000033;
            color: #FFFF00;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 10px;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Tło z zapętlonym wideo rybek */
        #bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -2;
            opacity: 0.45;
            pointer-events: none;
        }

        #bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Warstwy do przejścia typu Windows Movie Maker (Star Wipe) */
        #app-root {
            position: relative;
            z-index: 1;
        }

        #transition-incoming-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5000;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
            pointer-events: none;
            /* Start: mikroskopijna gwiazdka na środku ekranu */
            clip-path: polygon(
                50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%,
                50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%
            );
            transition: clip-path 1.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Koniec: gwiazda rozszerza się poza krawędzie ekranu, odsłaniając cały nowy widok */
        #transition-incoming-layer.star-wipe-open {
            clip-path: polygon(
                50% -260%, 82% -65%, 280% -65%, 125% 45%, 185% 230%,
                50% 120%, -85% 230%, -25% 45%, -180% -65%, 18% -65%
            );
        }

        /* Klasyczny układ portalu */
        .main-table {
            width: 850px;
            max-width: 100%;
            margin: 0 auto;
            background-color: rgba(0, 0, 102, 0.92);
            border: 4px ridge #C0C0C0;
            border-collapse: separate;
            border-spacing: 6px;
            position: relative;
        }

        /* Szeroki poziomy prostokąt dla ekranu głosowania */
        .voting-landscape-box {
            width: 1120px;
            max-width: 96vw;
            margin: 15px auto;
            background-color: rgba(0, 0, 85, 0.96);
            border: 5px ridge #FFCC00;
            padding: 18px 24px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
            position: relative;
        }

        td, th {
            border: 2px inset #808080;
            padding: 10px;
            vertical-align: top;
        }

        .header-cell {
            background-color: #000000;
            text-align: center;
            border: 3px groove #FFCC00;
        }

        .marquee-bar {
            background-color: #FF0000;
            color: #FFFFFF;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            padding: 4px;
            border: 2px outset #FF6666;
        }

        .sidebar-cell {
            width: 225px;
            background-color: rgba(0, 0, 68, 0.95);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        .sidebar-title {
            background-color: #FFCC00;
            color: #000000;
            font-weight: bold;
            text-align: center;
            padding: 4px;
            border: 2px outset #FFFFFF;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .sidebar-link {
            display: block;
            color: #00FFFF;
            text-decoration: underline;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .sidebar-link:hover {
            color: #FF00FF;
            background-color: #000088;
        }

        .content-cell {
            background-color: rgba(0, 0, 85, 0.95);
            color: #FFFFFF;
        }
