<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~*~ SKIBIDI AWARDS 2006 - OFICJALNY PORTAL GŁOSOWANIA ~*~</title>
    <style>
        body {
            background-color: #000033;
            color: #FFFF00;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 10px;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Zapętlone wideo w tle */
        #bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
            background-color: #000022;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.55; /* Lekkie przyciemnienie, żeby tekst był czytelny */
        }

        /* Delikatna siatka w klimacie lat 2000 na wideo */
        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }

        .main-table {
            width: 850px;
            max-width: 100%;
            margin: 0 auto;
            background-color: rgba(0, 0, 102, 0.88);
            border: 4px ridge #C0C0C0;
            border-collapse: separate;
            border-spacing: 6px;
            position: relative;
            z-index: 1;
        }

        td, th {
            border: 2px inset #808080;
            padding: 10px;
            vertical-align: top;
        }

        .header-cell {
            background-color: rgba(0, 0, 0, 0.92);
            text-align: center;
            border: 3px groove #FFCC00;
        }

        .marquee-bar {
            background-color: #FF0000;
            color: #FFFFFF;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            padding: 4px;
            border: 2px outset #FF6666;
        }

        .sidebar-cell {
            width: 225px;
            background-color: rgba(0, 0, 68, 0.9);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        .sidebar-title {
            background-color: #FFCC00;
            color: #000000;
            font-weight: bold;
            text-align: center;
            padding: 4px;
            border: 2px outset #FFFFFF;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .sidebar-link {
            display: block;
            color: #00FFFF;
            text-decoration: underline;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .sidebar-link:hover {
            color: #FF00FF;
            background-color: #000088;
        }

        .content-cell {
            background-color: rgba(0, 0, 85, 0.88);
            color: #FFFFFF;
        }
