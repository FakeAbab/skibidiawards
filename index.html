<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Awards - Głosowanie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            700: '#a16207',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-gold-500 selection:text-zinc-950">

    <!-- Kontener główny aplikacji -->
    <div id="app" class="flex-grow flex flex-col">
        <!-- Treść ładowana dynamicznie przez JS -->
    </div>

    <!-- Stopka -->
    <footer class="py-6 text-center text-xs text-zinc-600 border-t border-zinc-900">
        Streamer Awards • Oficjalny Panel Głosowania
    </footer>

    <script>
        // --- KONFIGURACJA STRONY ---
        const EVENT_CONFIG = {
            title: "STREAMER AWARDS 2026",
            subtitle: "Wybierz swoich ulubionych twórców roku. Zagłosuj w poniższych kategoriach, a na koniec sprawdź swoje oficjalne podsumowanie (VIP Ballot)."
        };

        const categories = [
            {
                id: 1,
                name: "Streamer Roku",
                description: "Twórca, który zdefiniował ten rok swoimi niesamowitymi transmisjami.",
                nominees: [
                    { id: 's1', name: 'xThzt', tag: '@xthzt', image: '' },
                    { id: 's2', name: 'VibeCheck', tag: '@vibecheck', image: '' },
                    { id: 's3', name: 'KrólowaChatu', tag: '@krolowachat', image: '' },
                    { id: 's4', name: 'PixelArtur', tag: '@pixelartur', image: '' }
                ]
            },
            {
                id: 2,
                name: "Najlepszy Stream Just Chatting",
                description: "Mistrzowie konwersacji, podcastów i budowania relacji z widzami.",
                nominees: [
                    { id: 's5', name: 'GadulaPL', tag: '@gadulapl', image: '' },
                    { id: 's6', name: 'KawiarniaKrótkich', tag: '@kawiarnia', image: '' },
                    { id: 's7', name: 'NocneGadki', tag: '@nocnegadki', image: '' },
                    { id: 's8', name: 'PanEgzekutor', tag: '@panegzekutor', image: '' }
                ]
            },
            {
                id: 3,
                name: "Odkrycie Roku",
                description: "Gwiazdy, które w tym roku eksplodowały na scenie streamingowej.",
                nominees: [
                    { id: 's9', name: 'NowyNaRewirze', tag: '@nowynarewirze', image: '' },
                    { id: 's10', name: 'ŚwieżaKrew', tag: '@swiezakrew', image: '' },
                    { id: 's11', name: 'Błyskawica', tag: '@blyskawica', image: '' },
                    { id: 's12', name: 'TurboStart', tag: '@turbostart', image: '' }
                ]
            },
            {
                id: 4,
                name: "Najlepszy Streamer Gamingowy",
                description: "Najwyższy skill, najwięcej emocji i niepowtarzalne akcje w grach.",
                nominees: [
                    { id: 's13', name: 'ProGamer_99', tag: '@progamer', image: '' },
                    { id: 's14', name: 'AimBotGirl', tag: '@aimbotgirl', image: '' },
                    { id: 's15', name: 'SpeedrunMaster', tag: '@speedrun', image: '' },
                    { id: 's16', name: 'CierpliwyGracz', tag: '@cierpliwy', image: '' }
                ]
            },
            {
                id: 5,
                name: "Wydarzenie / Stream Specjalny Roku",
                description: "Najlepszy projekt, event plenerowy lub charytatywny.",
                nominees: [
                    { id: 's17', name: 'WielkaWyprawa 24h', tag: '@wyprawa', image: '' },
                    { id: 's18', name: 'Charytatywny Maraton', tag: '@pomagamy', image: '' },
                    { id: 's19', name: 'Bitwa Streamerów', tag: '@bitwa', image: '' },
                    { id: 's20', name: 'Wyspa Przetrwania', tag: '@wyspa', image: '' }
                ]
            }
        ];

        let state = {
            step: 'intro', // 'intro', 'voting', 'summary'
            currentCategoryIndex: 0,
            votes: {} // { categoryId: nomineeId }
        };

        function render() {
            const app = document.getElementById('app');
            
            if (state.step === 'intro') {
                app.innerHTML = `
                    <div class="flex-grow flex flex-col items-center justify-center p-6 text-center max-w-2xl mx-auto">
                        <div class="mb-6 relative">
                            <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-gold-500 to-amber-700 opacity-30 blur-lg animate-pulse"></div>
                            <div class="relative w-24 h-24 rounded-2xl bg-zinc-900 border border-gold-500/30 flex items-center justify-center text-gold-400 shadow-2xl">
                                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                                </svg>
                            </div>
                        </div>
                        <span class="text-xs uppercase tracking-widest text-gold-500 font-semibold mb-3 bg-gold-500/10 px-3 py-1 rounded-full border border-gold-500/20">Oficjalny Plebiscyt</span>
                        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-4 text-white">${EVENT_CONFIG.title}</h1>
                        <p class="text-zinc-400 text-base sm:text-lg mb-8 leading-relaxed">${EVENT_CONFIG.subtitle}</p>
                        <button onclick="startVoting()" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-gold-500 to-amber-600 hover:from-gold-400 hover:to-amber-500 text-zinc-950 font-bold rounded-xl shadow-lg shadow-gold-500/20 transition-all transform hover:-translate-y-0.5 active:translate-y-0 cursor-pointer">
                            ROZPOCZNIJ GŁOSOWANIE
                        </button>
                    </div>
                `;
            } else if (state.step === 'voting') {
                const cat = categories[state.currentCategoryIndex];
                const totalCats = categories.length;
                const progressPercent = ((state.currentCategoryIndex + 1) / totalCats) * 100;
                const selectedNomineeId = state.votes[cat.id];

                let dotsHtml = '';
                for (let i = 0; i < totalCats; i++) {
                    let dotBg = 'bg-zinc-800 border-zinc-700';
                    if (i < state.currentCategoryIndex || state.votes[categories[i].id]) {
                        dotBg = 'bg-gold-500 border-gold-500 text-zinc-950';
                    } else if (i === state.currentCategoryIndex) {
                        dotBg = 'bg-zinc-900 border-gold-500 text-gold-400 ring-2 ring-gold-500/30';
                    }
                    dotsHtml += `<div class="w-8 h-8 rounded-full border flex items-center justify-center text-xs font-bold transition-all ${dotBg}">${i + 1}</div>`;
                }

                let nomineesHtml = '';
                cat.nominees.forEach(nom => {
                    const isSelected = selectedNomineeId === nom.id;
                    let cardBorder = isSelected ? 'border-gold-500 bg-gold-500/10 shadow-lg shadow-gold-500/10' : 'border-zinc-800 bg-zinc-900/60 hover:border-zinc-700';
                    let checkMark = isSelected ? `
                        <div class="absolute top-3 right-3 w-6 h-6 bg-gold-500 text-zinc-950 rounded-full flex items-center justify-center font-bold text-xs shadow">
                            ✓
                        </div>` : '';

                    let avatarContent = nom.image ? 
                        `<img src="${nom.image}" class="w-20 h-20 rounded-full object-cover border-2 border-gold-500/30 mb-3">` :
                        `<div class="w-20 h-20 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-gold-400 font-bold text-xl mb-3 shadow-inner">${nom.name.substring(0, 2).toUpperCase()}</div>`;

                    nomineesHtml += `
                        <div onclick="voteForNominee('${cat.id}', '${nom.id}')" class="relative group cursor-pointer p-5 rounded-2xl border ${cardBorder} transition-all flex flex-col items-center text-center">
                            ${checkMark}
                            ${avatarContent}
                            <h3 class="font-bold text-lg text-white mb-1 group-hover:text-gold-400 transition-colors">${nom.name}</h3>
                            <span class="text-xs text-zinc-500">${nom.tag}</span>
                        </div>
                    `;
                });

                app.innerHTML = `
                    <div class="max-w-4xl mx-auto w-full p-4 sm:p-6 flex-grow flex flex-col justify-between">
                        <div>
                            <!-- Pasek postępu -->
                            <div class="mb-8">
                                <div class="flex justify-between items-center mb-3 text-xs uppercase tracking-wider text-zinc-400 font-semibold">
                                    <span>Kategoria ${state.currentCategoryIndex + 1} z ${totalCats}</span>
                                    <span>${Math.round(progressPercent)}% ukończono</span>
                                </div>
                                <div class="w-full bg-zinc-900 h-2 rounded-full overflow-hidden border border-zinc-800 mb-6">
                                    <div class="bg-gradient-to-r from-gold-600 to-gold-400 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                                </div>
                                <div class="flex justify-center gap-2 sm:gap-3">${dotsHtml}</div>
                            </div>

                            <!-- Nagłówek kategorii -->
                            <div class="text-center mb-8">
                                <h2 class="text-2xl sm:text-4xl font-extrabold text-white mb-2">${cat.name}</h2>
                                <p class="text-zinc-400 text-sm sm:text-base">${cat.description}</p>
                            </div>

                            <!-- Siatka nominowanych -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                ${nomineesHtml}
                            </div>
                        </div>

                        <!-- Przyciski nawigacji -->
                        <div class="flex justify-between items-center pt-4 border-t border-zinc-900">
                            <button onclick="prevCategory()" class="px-5 py-2.5 rounded-xl border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 text-sm font-semibold transition-all cursor-pointer ${state.currentCategoryIndex === 0 ? 'invisible' : ''}">
                                ← Wstecz
                            </button>
                            <button onclick="nextCategory()" class="px-6 py-2.5 rounded-xl bg-gold-500 hover:bg-gold-400 text-zinc-950 text-sm font-bold shadow-md shadow-gold-500/10 transition-all cursor-pointer ${!selectedNomineeId ? 'opacity-50 cursor-not-allowed' : ''}">
                                ${state.currentCategoryIndex === totalCats - 1 ? 'Podsumowanie Głosu →' : 'Dalej →'}
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.step === 'summary') {
                let summaryItemsHtml = '';
                categories.forEach((cat, index) => {
                    const nomineeId = state.votes[cat.id];
                    const nominee = cat.nominees.find(n => n.id === nomineeId);
                    
                    summaryItemsHtml += `
                        <div class="p-4 rounded-xl bg-zinc-900/60 border border-zinc-800/80 flex items-center justify-between gap-4">
                            <div>
                                <span class="text-xs uppercase tracking-wider text-gold-500 font-semibold block mb-1">Kategoria ${index + 1}: ${cat.name}</span>
                                <h4 class="text-lg font-bold text-white">${nominee ? nominee.name : 'Brak głosu'}</h4>
                            </div>
                            <button onclick="goToCategory(${index})" class="px-3 py-1.5 rounded-lg border border-zinc-700 text-xs font-semibold text-zinc-400 hover:text-white hover:bg-zinc-800 transition-all cursor-pointer">
                                Zmień
                            </button>
                        </div>
                    `;
                });

                app.innerHTML = `
                    <div class="max-w-2xl mx-auto w-full p-4 sm:p-6 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="text-center mb-8">
                                <span class="text-xs uppercase tracking-widest text-gold-500 font-semibold mb-2 inline-block bg-gold-500/10 px-3 py-1 rounded-full border border-gold-500/20">VIP Ballot</span>
                                <h2 class="text-3xl font-extrabold text-white mb-2">Twoje podsumowanie głosowania</h2>
                                <p class="text-zinc-400 text-sm">Sprawdź swoje typy. Możesz jeszcze zmienić dowolny wybór lub zatwierdzić ostateczny głos.</p>
                            </div>

                            <div class="space-y-3 mb-8">
                                ${summaryItemsHtml}
                            </div>
                        </div>

                        <div class="space-y-3 pt-4 border-t border-zinc-900">
                            <button onclick="submitVotes()" class="w-full py-4 bg-gradient-to-r from-gold-500 to-amber-600 hover:from-gold-400 hover:to-amber-500 text-zinc-950 font-bold rounded-xl shadow-lg shadow-gold-500/20 transition-all cursor-pointer">
                                ZATWIERDZ I WYŚLIJ GŁOSY
                            </button>
                            <button onclick="copySummary()" class="w-full py-3 rounded-xl border border-zinc-800 text-zinc-400 hover:text-white hover:border-zinc-700 text-sm font-semibold transition-all cursor-pointer">
                                Kopiuj podsumowanie do schowka
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.step === 'success') {
                app.innerHTML = `
                    <div class="flex-grow flex flex-col items-center justify-center p-6 text-center max-w-xl mx-auto">
                        <div class="w-20 h-20 rounded-full bg-gold-500/10 border border-gold-500/30 flex items-center justify-center text-gold-400 text-3xl mb-6 shadow-xl">
                            🎉
                        </div>
                        <h2 class="text-3xl font-extrabold text-white mb-3">Głosy zostały zarejestrowane!</h2>
                        <p class="text-zinc-400 text-sm mb-8">Dziękujemy za wzięcie udziału w plebiscycie. Twój głos ma znaczenie!</p>
                        <button onclick="resetApp()" class="px-6 py-3 rounded-xl border border-zinc-800 text-zinc-400 hover:text-white text-sm font-semibold transition-all cursor-pointer">
                            Zagłosuj ponownie
                        </button>
                    </div>
                `;
            }
        }

        function startVoting() {
            state.step = 'voting';
            state.currentCategoryIndex = 0;
            render();
        }

        function voteForNominee(catId, nomineeId) {
            state.votes[catId] = nomineeId;
            render();
        }

        function nextCategory() {
            const cat = categories[state.currentCategoryIndex];
            if (!state.votes[cat.id]) return; // Wymóg zaznaczenia

            if (state.currentCategoryIndex < categories.length - 1) {
                state.currentCategoryIndex++;
                render();
            } else {
                state.step = 'summary';
                render();
            }
        }

        function prevCategory() {
            if (state.currentCategoryIndex > 0) {
                state.currentCategoryIndex--;
                render();
            } else {
                state.step = 'intro';
                render();
            }
        }

        function goToCategory(index) {
            state.currentCategoryIndex = index;
            state.step = 'voting';
            render();
        }

        function submitVotes() {
            state.step = 'success';
            render();
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function copySummary() {
            let text = "✨ Moje typy na Streamer Awards:\n";
            categories.forEach((cat, index) => {
                const nomId = state.votes[cat.id];
                const nom = cat.nominees.find(n => n.id === nomId);
                text += `${index + 1}. ${cat.name}: ${nom ? nom.name : 'Brak'}\n`;
            });
            navigator.clipboard.writeText(text);
            alert("Skopiowano podsumowanie do schowka!");
        }

        // Start aplikacji
        render();
    </script>
</body>
</html>
