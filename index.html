<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~*~ SKIBIDI AWARDS 2006 - OFICJALNY PORTAL GŁOSOWANIA ~*~</title>
    <style>
        body {
            background-color: #000033;
            color: #FFFF00;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 10px;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Tło z zapętlonym wideo rybek */
        #bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -2;
            opacity: 0.45;
            pointer-events: none;
        }

        #bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Nakładka przejścia w kształcie gwiazdy */
        #star-transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
        }

        #star-mask-layer {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #FFCC00 0%, #FF0066 50%, #000044 100%);
            clip-path: polygon(
                50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%,
                50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%
            );
            transition: clip-path 1.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #star-mask-layer.expand {
            clip-path: polygon(
                50% -150%, 75% -40%, 200% -40%, 100% 35%, 140% 160%,
                50% 95%, -40% 160%, 0% 35%, -100% -40%, 25% -40%
            );
        }

        /* Klasyczny układ portalu */
        .main-table {
            width: 850px;
            max-width: 100%;
            margin: 0 auto;
            background-color: rgba(0, 0, 102, 0.90);
            border: 4px ridge #C0C0C0;
            border-collapse: separate;
            border-spacing: 6px;
            position: relative;
            z-index: 1;
        }

        /* Szeroki poziomy prostokąt dla ekranu głosowania */
        .voting-landscape-box {
            width: 1120px;
            max-width: 96vw;
            margin: 15px auto;
            background-color: rgba(0, 0, 85, 0.94);
            border: 5px ridge #FFCC00;
            padding: 18px 24px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            position: relative;
            z-index: 1;
        }

        td, th {
            border: 2px inset #808080;
            padding: 10px;
            vertical-align: top;
        }

        .header-cell {
            background-color: #000000;
            text-align: center;
            border: 3px groove #FFCC00;
        }

        .marquee-bar {
            background-color: #FF0000;
            color: #FFFFFF;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            padding: 4px;
            border: 2px outset #FF6666;
        }

        .sidebar-cell {
            width: 225px;
            background-color: rgba(0, 0, 68, 0.94);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        .sidebar-title {
            background-color: #FFCC00;
            color: #000000;
            font-weight: bold;
            text-align: center;
            padding: 4px;
            border: 2px outset #FFFFFF;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .sidebar-link {
            display: block;
            color: #00FFFF;
            text-decoration: underline;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .sidebar-link:hover {
            color: #FF00FF;
            background-color: #000088;
        }

        .content-cell {
            background-color: rgba(0, 0, 85, 0.94);
            color: #FFFFFF;
        }

        .retro-btn {
            background-color: #C0C0C0;
            color: #000000;
            font-family: "Arial Black", Impact, sans-serif;
            font-size: 18px;
            padding: 10px 24px;
            border: 4px outset #FFFFFF;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .retro-btn:active {
            border: 4px inset #808080;
            background-color: #A0A0A0;
        }

        .retro-btn-small {
            background-color: #C0C0C0;
            color: #000000;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 13px;
            padding: 6px 14px;
            border: 3px outset #FFFFFF;
            cursor: pointer;
        }

        .retro-btn-small:active {
            border: 3px inset #808080;
        }

        .mega-download-btn {
            display: inline-block;
            background: linear-gradient(180deg, #00FF00 0%, #009900 100%);
            color: #000000;
            font-family: "Comic Sans MS", "Arial Black", Impact, sans-serif;
            font-size: 20px;
            font-weight: 900;
            padding: 18px 20px;
            border: 6px outset #88FF88;
            text-decoration: none;
            text-shadow: 1px 1px 0px #FFFFFF;
            box-shadow: 0 0 20px #00FF00;
            cursor: pointer;
            word-break: break-word;
            line-height: 1.25;
        }

        .mega-download-btn:hover {
            background: linear-gradient(180deg, #FFFF00 0%, #FF9900 100%);
            border-color: #FFFF88;
            box-shadow: 0 0 25px #FFFF00;
            transform: scale(1.02);
        }

        /* Siatka 2 rzędy po 3 opcje w układzie prostokątnym */
        .nominees-grid-6 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 16px 0;
        }

        @media (max-width: 768px) {
            .nominees-grid-6 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .nominee-box {
            background-color: #000033;
            border: 3px outset #6666CC;
            padding: 12px 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .nominee-box:hover {
            border-color: #FFFF00;
            background-color: #000077;
        }

        .nominee-selected {
            background-color: #660000 !important;
            border: 3px inset #FFCC00 !important;
            box-shadow: 0 0 12px #FFCC00;
        }

        .avatar-placeholder {
            width: 68px;
            height: 68px;
            margin: 0 auto 8px auto;
            background-color: #C0C0C0;
            color: #000000;
            border: 2px inset #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: 20px;
        }

        .blink {
            animation: blinker 0.7s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .counter-box {
            background-color: #000000;
            color: #00FF00;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            border: 2px inset #808080;
            padding: 2px 8px;
            display: inline-block;
            letter-spacing: 2px;
        }

        .placeholder-banner {
            background-color: #111111;
            border: 2px dashed #FFCC00;
            color: #CCCCCC;
            text-align: center;
            padding: 15px;
            margin-top: 15px;
            font-family: "Courier New", monospace;
            font-size: 12px;
        }

        .trust-badge {
            display: inline-block;
            background-color: #000088;
            border: 2px outset #00FFFF;
            color: #00FFFF;
            font-family: "Courier New", monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            margin: 3px;
        }
    </style>
</head>
<body>

    <!-- Nakładka przejścia w kształcie gwiazdy -->

    <!-- Główny kontener aplikacji -->
    <div id="app-root"></div>

    <script>
        // 6 opcji w każdej kategorii (2 rzędy po 3 opcje)
        const categories = [
            {
                id: 1,

                    { id: 's3', name: 'KrólowaChatu', tag: 'GG: 993812', image: '' },
                    { id: 's4', name: 'PixelArtur', tag: 'GG: 551029', image: '' },

                    { id: 's9', name: 'NocneGadki', tag: 'IRC #polska', image: '' },
                    { id: 's10', name: 'PanEgzekutor', tag: 'Skype 2.0', image: '' },

            {

                description: "Nowa gwiazda, która rozbiła bank na Naszej-Klasie i forach.",
                nominees: [
                    { id: 's13', name: 'NowyNaRewirze', tag: 'Debiutant', image: '' },
                    { id: 's14', name: 'ŚwieżaKrew', tag: 'Debiutant', image: '' },
                    { id: 's15', name: 'Błyskawica', tag: 'Debiutant', image: '' },
                    { id: 's16', name: 'TurboStart', tag: 'Debiutant', image: '' },
                    { id: 's17', name: 'SzybkiBill', tag: 'Debiutant', image: '' },

            },
            {
                id: 4,
                name: "Mistrz Gier Komputerowych",
                description: "Najlepszy gracz CS 1.6, Tibii, Gothica i Metina.",
                nominees: [
                    { id: 's19', name: 'ProGamer_99', tag: 'CS 1.6 Pro', image: '' },
                    { id: 's20', name: 'AimBotGirl', tag: 'Tibia 7.6', image: '' },
                    { id: 's21', name: 'SpeedrunMaster', tag: 'Gothic II', image: '' },

        let state = {
            view: 'home', // 'home', 'voting', 'summary', 'download'
            currentCategoryIndex: 0,
            votes: {}

        let sfxToggle = 0; // 0 -> dzwiek1.mp3, 1 -> dzwiek2.mp3
        let isTransitioning = false;

        // Odblokowanie dźwięku z rybek przy pierwszym kliknięciu gdziekolwiek (muzyka gra cały czas!)
        function ensureFishAudioPlaying() {
            const fishVideo = document.getElementById('bg-fish-video');
            if (fishVideo) {
                fishVideo.muted = false;
                fishVideo.volume = 0.55;
                if (fishVideo.paused) {
                    fishVideo.play().catch(() => {});
                }
            }
        }

        document.addEventListener('click', ensureFishAudioPlaying, { once: true });

        // Odtwarzanie dźwięku przejścia na zmianę (dzwiek1.mp3 / dzwiek2.mp3)
        function playAlternatingTransitionSound() {
            ensureFishAudioPlaying();
            const audioId = sfxToggle === 0 ? 'sfx-1' : 'sfx-2';
            sfxToggle = sfxToggle === 0 ? 1 : 0;

            const sfx = document.getElementById(audioId);
            if (sfx) {
                sfx.currentTime = 0;
                sfx.volume = 0.85;
                sfx.play().catch(e => console.log("Brak pliku dźwięku lub blokada autoplay:", e));
            }
        }

        // Gładkie przejście w kształcie gwiazdy zsynchronizowane z dźwiękiem
        function runStarTransition(callbackUpdateState) {
            if (isTransitioning) return;
            isTransitioning = true;

            playAlternatingTransitionSound();

            const mask = document.getElementById('star-mask-layer');
            // 1. Gwiazda rozszerza się i zakrywa stary ekran (ok. 1.1s)
            mask.classList.add('expand');

            // 2. W szczytowym momencie zakrycia ekranu podmieniamy układ na nowy
            setTimeout(() => {
                callbackUpdateState();
                render();

                // 3. Gwiazda kurczy się z powrotem, odsłaniając nowy kształt strony
                setTimeout(() => {
                    mask.classList.remove('expand');
                    setTimeout(() => {
                        isTransitioning = false;
                    }, 1100);
                }, 120);
            }, 1100);
        }

        function render() {
            const root = document.getElementById('app-root');

            // WIDOK GŁOSOWANIA: SZEROKI PROSTOKĄT BOKIEM (TYTUŁ NA GÓRZE + 6 OPCJI 2x3)
            if (state.view === 'voting') {
                const cat = categories[state.currentCategoryIndex];
                const total = categories.length;
                const selectedId = state.votes[cat.id];

                let gridHtml = '<div class="nominees-grid-6">';
                cat.nominees.forEach((nom) => {
                    const isSelected = selectedId === nom.id;
                    const avatar = nom.image
                        ? `<img src="${nom.image}" style="width:68px; height:68px; border:2px inset #FFF; object-fit:cover; margin-bottom:6px;">`
                        : `<div class="avatar-placeholder">${nom.name.substring(0, 2).toUpperCase()}</div>`;

                    gridHtml += `
                        <div class="nominee-box ${isSelected ? 'nominee-selected' : ''}" onclick="selectNominee(${cat.id}, '${nom.id}')">

                                ${isSelected ? '★ ' + nom.name + ' ★' : nom.name}
                            </div>
                            <div style="font-size: 11px; color: #CCCCCC; margin-top: 3px;">${nom.tag}</div>
                            <div style="margin-top: 6px; font-size: 11px; font-family: Arial; color: ${isSelected ? '#00FF00' : '#888888'};">
                                ${isSelected ? '[ WYBRANO ]' : '[ Kliknij aby wybrać ]'}
                            </div>
                        </div>
                    `;
                });
                gridHtml += '</div>';

                root.innerHTML = `
                    <div class="voting-landscape-box">
                        <div style="background-color: #000033; padding: 6px 12px; border: 2px inset #808080; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-family: 'Courier New', monospace; font-size: 13px;">
                            <span>★ SKIBIDI AWARDS 2006 ★ | KATEGORIA: <b>${state.currentCategoryIndex + 1} / ${total}</b></span>
                            <span style="color: #00FF00;">POSTĘP: ${Math.round(((state.currentCategoryIndex + 1) / total) * 100)}%</span>
                            <button class="retro-btn-small" onclick="showHome()">✖ WYJDŹ</button>
                        </div>

                        <!-- TYTUŁ KATEGORII NA ŚRODKU NA GÓRZE -->
                        <div style="text-align: center; margin-bottom: 8px; border-bottom: 2px groove #FFCC00; padding-bottom: 8px;">

                        </div>

                        ${gridHtml}

                        <!-- NAWIGACJA NA DOLE -->

                            <button class="retro-btn-small" onclick="prevCategory()">&lt;&lt; POPRZEDNIA KATEGORIA</button>

                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            // POZOSTAŁE WIDOKI: KLASYCZNA TABELA PORTALU 2006

                        <p style="font-size: 15px; line-height: 1.5; color: #FFFFFF;">

                            <span class="blink" style="color: #FF0000; font-weight: bold;">!!! WAŻNY KOMUNIKAT !!!</span><br>
                            <span style="font-size: 13px; color: #FFFF00;">Głosowanie jest całkowicie darmowe (nie trzeba wysyłać SMS-a za 9zł + VAT).</span>
                        </div>

                        <button class="retro-btn" onclick="startVoting()">&gt;&gt; PRZEJDŹ DO GŁOSOWANIA &lt;&lt;</button>

                        <h2 style="color: #00FF00; font-family: 'Comic Sans MS', Impact, sans-serif; margin: 12px 0 6px 0; text-shadow: 2px 2px #000000;">

                        <div style="margin-bottom: 12px;">

                        <div style="background-color: #000044; border: 2px inset #808080; padding: 8px; margin-bottom: 16px; font-family: 'Courier New', monospace; font-size: 12px; color: #CCCCCC;">

                        </div>

                        <div style="font-size: 24px; color: #FFFF00; margin-bottom: 8px;">
                            <span class="blink">⬇⬇⬇ KLIKNIJ PONIŻEJ ⬇⬇⬇</span>
                        </div>

                        <div style="margin: 15px 0;">
                            <a href="slimakajki/AJCZOKTWERK.mp4" download="AJCZOKTWERK.mp4" class="mega-download-btn">
                                DOWNLOAD 4 FREE RLY NO SCAM PLS DOWNLOAD NOW NOWWWWW!!!!!!!!1111111111111
                            </a>
                        </div>

                        <div style="font-size: 11px; color: #AAAAAA; font-family: Arial, sans-serif; margin-top: 12px;">
                            * Jeśli pobieranie nie wystartuje automatycznie, kliknij przycisk powyżej prawym przyciskiem myszy i wybierz „Zapisz element docelowy jako...”.
                        </div>

                        <div style="margin-top: 18px; border-top: 2px groove #808080; padding-top: 10px;">
                            <button class="retro-btn-small" onclick="showHome()">« WRÓĆ NA STRONĘ GŁÓWNĄ</button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'summary') {
                let rowsHtml = '';
                categories.forEach((cat, idx) => {
                    const nomId = state.votes[cat.id];
                    const nom = cat.nominees.find(n => n.id === nomId);
                    rowsHtml += `
                        <tr>
                            <td style="background-color: #000033; color: #FFCC00; font-weight: bold; width: 45%;">
                                ${idx + 1}. ${cat.name}

                                ${nom ? '🏆 ' + nom.name : '---'}

                                <button class="retro-btn-small" onclick="editCategory(${idx})">Zmień</button>
                            </td>
                        </tr>
                    `;
                });

                mainContentHtml = `
                    <div id="vip-ballot-card" style="background-color: #000022; border: 4px double #FFCC00; padding: 12px;">
                        <div style="text-align: center; border-bottom: 2px solid #FFCC00; padding-bottom: 8px; margin-bottom: 10px;">
                            <span style="background-color: #FF0000; color: #FFF; padding: 2px 6px; font-size: 11px; font-weight: bold;">OFICJALNA KARTA GŁOSOWANIA</span>
                            <h2 style="color: #FFFF00; margin: 6px 0 2px 0;">SKIBIDI AWARDS 2006 - MOJE TYPY</h2>
                            <span style="font-size: 11px; color: #AAAAAA; font-family: 'Courier New', monospace;">Zrób PrintScreen (PrtScn) i wklej w Painta!</span>

                        <table style="width: 100%; border-collapse: collapse;">
                            ${rowsHtml}

            render();
        }

        function nextCategory() {
            const cat = categories[state.currentCategoryIndex];
            if (!state.votes[cat.id]) {
                alert("Musisz najpierw wybrać swojego faworyta w tej kategorii!");
                return;
            }
            if (state.currentCategoryIndex < categories.length - 1) {
                runStarTransition(() => {
                    state.currentCategoryIndex++;
                });
            } else {
                runStarTransition(() => {
                    state.view = 'summary';
                });
            }
        }

        function prevCategory() {
            if (state.currentCategoryIndex > 0) {
                runStarTransition(() => {
                    state.currentCategoryIndex--;
                });
            } else {
                state.view = 'home';
                render();
            }
        }

        function editCategory(index) {
            runStarTransition(() => {
                state.currentCategoryIndex = index;
                state.view = 'voting';
            });
        }

        function copyVotes() {
            let text = "=== MOJE TYPY - SKIBIDI AWARDS 2006 ===\n";
            categories.forEach((cat, idx) => {
                const nom = cat.nominees.find(n => n.id === state.votes[cat.id]);
                text += `${idx + 1}. ${cat.name}: ${nom ? nom.name : 'Brak'}\n`;
            });
            navigator.clipboard.writeText(text);
            alert("Skopiowano Twoje typy! Możesz teraz wkleić je znajomym na Gadu-Gadu!");
        }
