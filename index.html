<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~*~ SKIBIDI AWARDS 2006 - OFICJALNY PORTAL GŁOSOWANIA ~*~</title>
    <style>
        body {
            background-color: #000033;
            color: #FFFF00;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 10px;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Tło z zapętlonym wideo rybek */
        #bg-video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -2;
            opacity: 0.45;
            pointer-events: none;
        }

        #bg-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Warstwa aktualnego ekranu */
        #app-root {
            position: relative;
            z-index: 1;
            transition: filter 0.4s ease;
        }

        /* Lekkie przyciemnienie stareго ekranu podczas trwania przejścia */
        #app-root.dimmed-during-wipe {
            filter: brightness(0.45);
        }

        /* Nakładka do przejścia Windows Movie Maker (Star Iris Wipe) */
        #transition-incoming-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5000;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
            pointer-events: none;
            filter: drop-shadow(0 0 12px #FFCC00);
            clip-path: polygon(
                50% 48%, 50.6% 49.4%, 52% 49.4%, 50.9% 50.3%, 51.3% 51.7%,
                50% 50.8%, 48.7% 51.7%, 49.1% 50.3%, 48% 49.4%, 49.4% 49.4%
            );
            transition: clip-path 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        #transition-incoming-layer.star-wipe-open {
            clip-path: polygon(
                50% -280%, 85% -60%, 290% -60%, 130% 55%, 190% 250%,
                50% 130%, -90% 250%, -30% 55%, -190% -60%, 15% -60%
            );
        }

        /* Klasyczny układ portalu */
        .main-table {
            width: 850px;
            max-width: 100%;
            margin: 0 auto;
            background-color: rgba(0, 0, 102, 0.92);
            border: 4px ridge #C0C0C0;
            border-collapse: separate;
            border-spacing: 6px;
            position: relative;
        }

        /* Szeroki poziomy prostokąt dla ekranu głosowania */
        .voting-landscape-box {
            width: 1120px;
            max-width: 96vw;
            margin: 15px auto;
            background-color: rgba(0, 0, 85, 0.97);
            border: 5px ridge #FFCC00;
            padding: 18px 24px;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
            position: relative;
        }

        td, th {
            border: 2px inset #808080;
            padding: 10px;
            vertical-align: top;
        }

        .header-cell {
            background-color: #000000;
            text-align: center;
            border: 3px groove #FFCC00;
        }

        .marquee-bar {
            background-color: #FF0000;
            color: #FFFFFF;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 14px;
            padding: 4px;
            border: 2px outset #FF6666;
        }

        .sidebar-cell {
            width: 225px;
            background-color: rgba(0, 0, 68, 0.95);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        .sidebar-title {
            background-color: #FFCC00;
            color: #000000;
            font-weight: bold;
            text-align: center;
            padding: 4px;
            border: 2px outset #FFFFFF;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .sidebar-link {
            display: block;
            color: #00FFFF;
            text-decoration: underline;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .sidebar-link:hover {
            color: #FF00FF;
            background-color: #000088;
        }

        .content-cell {
            background-color: rgba(0, 0, 85, 0.95);
            color: #FFFFFF;
        }

        .retro-btn {
            background-color: #C0C0C0;
            color: #000000;
            font-family: "Arial Black", Impact, sans-serif;
            font-size: 18px;
            padding: 10px 24px;
            border: 4px outset #FFFFFF;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .retro-btn:active {
            border: 4px inset #808080;
            background-color: #A0A0A0;
        }

        .retro-btn-small {
            background-color: #C0C0C0;
            color: #000000;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 13px;
            padding: 6px 14px;
            border: 3px outset #FFFFFF;
            cursor: pointer;
        }

        .retro-btn-small:active {
            border: 3px inset #808080;
        }

        .mega-download-btn {
            display: inline-block;
            background: linear-gradient(180deg, #00FF00 0%, #009900 100%);
            color: #000000;
            font-family: "Comic Sans MS", "Arial Black", Impact, sans-serif;
            font-size: 20px;
            font-weight: 900;
            padding: 18px 20px;
            border: 6px outset #88FF88;
            text-decoration: none;
            text-shadow: 1px 1px 0px #FFFFFF;
            box-shadow: 0 0 20px #00FF00;
            cursor: pointer;
            word-break: break-word;
            line-height: 1.25;
        }

        .mega-download-btn:hover {
            background: linear-gradient(180deg, #FFFF00 0%, #FF9900 100%);
            border-color: #FFFF88;
            box-shadow: 0 0 25px #FFFF00;
            transform: scale(1.02);
        }

        .nominees-grid-6 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 16px 0;
        }

        @media (max-width: 768px) {
            .nominees-grid-6 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .nominee-box {
            background-color: #000033;
            border: 3px outset #6666CC;
            padding: 12px 10px;
            text-align: center;
            cursor: pointer;
        }

        .nominee-box:hover {
            border-color: #FFFF00;
            background-color: #000077;
        }

        .nominee-selected {
            background-color: #660000 !important;
            border: 3px inset #FFCC00 !important;
            box-shadow: 0 0 12px #FFCC00;
        }

        .avatar-placeholder {
            width: 68px;
            height: 68px;
            margin: 0 auto 8px auto;
            background-color: #C0C0C0;
            color: #000000;
            border: 2px inset #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: 20px;
        }

        .blink {
            animation: blinker 0.7s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .counter-box {
            background-color: #000000;
            color: #00FF00;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            border: 2px inset #808080;
            padding: 2px 8px;
            display: inline-block;
            letter-spacing: 2px;
        }

        .placeholder-banner {
            background-color: #111111;
            border: 2px dashed #FFCC00;
            color: #CCCCCC;
            text-align: center;
            padding: 15px;
            margin-top: 15px;
            font-family: "Courier New", monospace;
            font-size: 12px;
        }

        .trust-badge {
            display: inline-block;
            background-color: #000088;
            border: 2px outset #00FFFF;
            color: #00FFFF;
            font-family: "Courier New", monospace;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            margin: 3px;
        }
    </style>
</head>

    <audio id="sfx-1" preload="auto">

    <audio id="sfx-2" preload="auto">
        <source src="slimakajki/dzwiek2.mp3" type="audio/mpeg">
    </audio>

    <div id="app-root"></div>

    <!-- Nakładka do przejścia typu Windows Movie Maker -->
    <div id="transition-incoming-layer"></div>
